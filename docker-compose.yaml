services:
  db:
    image: postgres:16-alpine
    container_name: mealprep-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mealprep}
      POSTGRES_USER: ${POSTGRES_USER:-mealprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealprep}
    volumes:
      - mealprep-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealprep} -d ${POSTGRES_DB:-mealprep}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mealprep-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealprep-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mealprep}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mealprep}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mealprep}
      THEMEALDB_BASE_URL: ${THEMEALDB_BASE_URL:-https://www.themealdb.com/api/json/v1}
      THEMEALDB_API_KEY: ${THEMEALDB_API_KEY:-1}
    ports:
      - "81:8080"
    networks:
      - mealprep-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mealprep-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - mealprep-net
    restart: unless-stopped

volumes:
  mealprep-db-data:

networks:
  mealprep-net:
    driver: bridge